<!doctype html>
<html>
    <head>
        <title>Prototype Version 3</title>
        <script src=script.js type=module></script>
        <link rel='stylesheet' href='stylesheet.css'>
    </head>
    <body>
        <section class='control-structure'>
            <header>Control Structure</header>
            <div>
                <button id='start-recording'>Start Recording</button>
                <button id='stop-recording' disabled>Stop Recording</button>
            </div>

            <div class='control-status-nope'>
                Not Recording
            </div>

        </section>
        <hr>
        <section class='audio-body'>
            <table>
            <caption>Recorded Audio</caption>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Audio Sample</th>
                        <th>Operate</th>
                    </tr>
                </thead>
                <tbody>
                    <!--
                    <tr>
                        <td>Not Applicable</td>
                        <td><audio controls src='example.mp3'></audio></td>
                        <td><button>Analyse</button></td>
                    </tr>
                    -->
                </tbody>
            </table>
        </section>

        <section class='results-body'>
            <table>
            <caption>Results</caption>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Guess 1</th>
                        <th>Guess 2</th>
                        <th>Guess 3</th>
                        <th>Guess 4</th>
                        <th>Guess 5</th>
                        <th>Class</th>
                        <th>Confidence</th>
                        <th>Anchors</th>
                        <th>Horn?</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>

        <section class='anchor-body'>
            <table>
            <caption>Anchor Summary</caption>
            <thead>
                <tr>
                    <th>Sl.No.</th>
                    <th>Horn Type</th>
                    <th>Count</th>
                </tr>
            </thead>
            <tbody></tbody>
            </table>
        </section>
    </body>
</html>
